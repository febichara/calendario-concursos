name: Vigia do CNJ

on:
  schedule:
    # Brasília é UTC-3 o ano todo. 06:00, 13:00 e 19:00 daqui.
    # Três disparos também cobrem o caso de o cron do GitHub atrasar ou pular
    # uma execução em horário de pico, o que acontece.
    - cron: "0 9,16,22 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: vigia-cnj
  cancel-in-progress: false

jobs:
  vigiar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Instalar o Chromium
        run: npx playwright install --with-deps chromium

      - name: Copiar a planilha
        run: node scripts/planilha.mjs

      - name: Ler o painel do CNJ
        run: node scripts/cnj.mjs

      - name: Comparar
        id: vigia
        run: node scripts/vigia.mjs

      - name: Avisar por issue (chega no seu e-mail)
        if: steps.vigia.outputs.mudou == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const body = fs.readFileSync('relatorio.md', 'utf8');
            const hoje = new Date().toLocaleDateString('pt-BR', { timeZone: 'America/Sao_Paulo' });
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Novidades no painel do CNJ — ${hoje}`,
              body
            });

      - name: Guardar a leitura de hoje
        run: |
          git config user.name "vigia-cnj"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/
          if git diff --staged --quiet; then
            echo "nada mudou — sem commit"
          else
            git commit -m "dados: leitura do CNJ de $(date +%F)"
            git pull --rebase --autostash origin main
            git push
          fi
